name: Read-only integration checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  static-and-offline-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python
        run: python -m compileall -q custom_components tests
      - name: Read-only and mapping tests
        run: python -m unittest discover -s tests -v

  ha-import-smoke:
    name: Home Assistant 2026.10.2 official container import
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Import modules using official Home Assistant container
        run: |
          docker run --rm -i --entrypoint python3 \
            -v "$PWD":/work -w /work \
            ghcr.io/home-assistant/home-assistant:2026.10.2 \
            - <<'PY'
          import importlib
          for path in (
              "custom_components.atlantic_cozytouch",
              "custom_components.atlantic_cozytouch.api",
              "custom_components.atlantic_cozytouch.config_flow",
              "custom_components.atlantic_cozytouch.sensor",
              "custom_components.atlantic_cozytouch.binary_sensor",
              "custom_components.atlantic_cozytouch.diagnostics",
              "custom_components.atlantic_cozytouch.energy_validation",
              "custom_components.atlantic_cozytouch.energy_preview",
              "custom_components.atlantic_cozytouch.energy_daily",
              "custom_components.atlantic_cozytouch.cop_hydraulic",
              "custom_components.atlantic_cozytouch.cop_accumulator",
              "custom_components.atlantic_cozytouch.heat_production_probe",
              "custom_components.atlantic_cozytouch.monthly_energy_probe",
              "custom_components.atlantic_cozytouch.thermal_evidence",
          ):
              importlib.import_module(path)
              print("OK", path)
          import yaml
          with open("dashboards/atlantic_energy_diagnostic_0_5_0.yaml", encoding="utf-8") as fh:
              data = yaml.safe_load(fh)
          assert data["type"] == "vertical-stack"
          assert len(data["cards"]) >= 7
          print("OK dashboard YAML")

          # Exercise actual entity registration (not only module imports).
          import asyncio
          from custom_components.atlantic_cozytouch.config_flow import (
              AtlanticReadOnlyConfigFlow, AtlanticReadOnlyOptionsFlow
          )
          assert isinstance(
              AtlanticReadOnlyConfigFlow.async_get_options_flow(None),
              AtlanticReadOnlyOptionsFlow,
          )
          from custom_components.atlantic_cozytouch.const import DOMAIN
          from custom_components.atlantic_cozytouch import sensor as sen, binary_sensor as bin_sen
          from custom_components.atlantic_cozytouch.compressor import CompressorMonitor
          class FakeCoordinator:
              atlantic_compressor = CompressorMonitor()
              data = [{
                  "id": "test_heatpump", "name": "Alfea Extensa S",
                  "values": {91: "CO", 112: 16.33},
                  "reported_capability_ids": [91, 112],
                  "updated_at": {},
              }]
              last_update_success = True
              def async_add_listener(self, callback):
                  return lambda: None
          class FakeEntry:
              entry_id = "smoke"
              def async_on_unload(self, callback):
                  pass
          class FakeHass:
              data = {DOMAIN: {"smoke": FakeCoordinator()}}
          async def check_registration():
              hass, entry = FakeHass(), FakeEntry()
              sensors, binaries = [], []
              await sen.async_setup_entry(hass, entry, sensors.extend)
              await bin_sen.async_setup_entry(hass, entry, binaries.extend)
              names = {e._attr_name for e in sensors}
              for name in (
                  "Uruchomienia sprężarki", "Czas pracy sprężarki",
                  "Modulacja sprężarki", "Czas pracy sprężarki — godziny",
                  "Średni czas pracy sprężarki na start",
              ):
                  assert name in names, f"Missing registered sensor: {name}"
              compressor = next(e for e in binaries if e._attr_name == "Sprężarka pracuje")
              assert compressor._attr_unique_id == "atlantic_cozytouch_test_heatpump_51"
              assert compressor.is_on is None
              assert all(e.native_value is None for e in sensors if e._attr_name in (
                  "Uruchomienia sprężarki", "Czas pracy sprężarki",
                  "Modulacja sprężarki", "Czas pracy sprężarki — godziny",
              ))
              audit = next(
                  e for e in sensors if e._attr_name == "COP Atlantic · audyt źródeł ciepła"
              )
              assert audit._attr_unique_id == "atlantic_cozytouch_smoke_thermal_evidence"
              assert audit.native_value == "oczekiwanie_na_dane"
              assert audit.extra_state_attributes["cop_okresowy_gotowy"] is False
              cumulative = [
                  e for e in sensors
                  if e._attr_name.startswith("COP Atlantic · skumulowany")
              ]
              assert len(cumulative) == 3
              assert all(e._attr_unique_id.startswith(
                  "atlantic_cozytouch_smoke_hydraulic_cumulative_"
              ) for e in cumulative)
              last_cop = next(
                  e for e in sensors
                  if e._attr_name == "COP Atlantic · ostatni poprawny szacunek (12 h)"
              )
              assert last_cop._attr_unique_id == "atlantic_cozytouch_smoke_hydraulic_last_cop"
              readiness = next(
                  e for e in sensors if e._attr_name == "COP Atlantic · gotowość danych"
              )
              attributes = readiness.extra_state_attributes
              assert attributes["rekordy_produkcji_ciepla"] is None
              assert attributes["produkcja_ciepla_zidentyfikowana"] is False
              print("OK safe COP evidence, no unverified producedQuantity as heat")
              print("OK optional compressor entities registered with unknown state")
          asyncio.run(check_registration())
          PY
